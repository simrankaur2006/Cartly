spring.application.name=ecommerce-management
server.port=${PORT:8080}

# Optional backend/.env file (KEY=value lines) is loaded automatically when present
spring.config.import=optional:file:.env[.properties]

# MongoDB (works with local MongoDB and MongoDB Atlas; just change MONGODB_URI)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:ecommerce_db}
spring.data.mongodb.auto-index-creation=true

# Clerk: issuer = your Clerk "Frontend API URL", e.g. https://your-app-12.clerk.accounts.dev
app.clerk-issuer=${CLERK_ISSUER:https://replace-me.clerk.accounts.dev}
app.admin-clerk-user-ids=${ADMIN_CLERK_USER_IDS:}
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.low-stock-threshold=${LOW_STOCK_THRESHOLD:10}
